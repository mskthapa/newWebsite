        .tagline {

            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Vertical Stack Links */
        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin-bottom: 1.75rem;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 52px;
            padding: 0.85rem 1.25rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
        }

        /* Hover Feedback */
        @media (hover: hover) {
            .link-card:hover {
                transform: translateY(-2px);
                box-shadow: var(--shadow-hover);
                border-color: var(--accent-color);
            }

            .link-card.primary:hover {
                background-color: var(--accent-hover);
            }
        }

        /* Touch Active Feedback */
        .link-card:active {
            transform: scale(0.98);
        }

        .link-card:focus-visible, .btn-secondary:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 3px;
        }

        .link-card.primary {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
        }

        .link-icon {

            justify-content: center;

    <script>
/* // Set dynamic copyright year */
    document.getElementById('year').textContent = new Date().getFullYear();

    /* // Native share or clipboard copy fallback */
    function shareProfile() {
        if (navigator.share) {
            navigator.share({
                title: 'MSK Thapa',
                url: window.location.href
            }).catch(() => {});
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert('Profile link copied to clipboard!');
        }
    }

    /* // Toggle light / dark theme cleanly */
    function toggleTheme() {
        const isDark = document.body.classList.contains('dark-theme') || 
            (!document.body.classList.contains('light-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);

        if (isDark) {
            document.body.classList.add('light-theme');
            document.body.classList.remove('dark-theme');
            document.getElementById('theme-toggle').textContent = '🌙 Dark Mode';
            localStorage.setItem('theme', 'light');
        } else {
            document.body.classList.add('dark-theme');
            document.body.classList.remove('light-theme');
            document.getElementById('theme-toggle').textContent = '☀️ Light Mode';
            localStorage.setItem('theme', 'dark');
        }
    }

    /* // Initialize saved or default system theme on load */
    (function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            document.body.classList.add('dark-theme');
            document.body.classList.remove('light-theme');
            document.getElementById('theme-toggle').textContent = '☀️ Light Mode';
        } else {
            document.body.classList.add('light-theme');
            document.body.classList.remove('dark-theme');
            document.getElementById('theme-toggle').textContent = '🌙 Dark Mode';
        }
    })();
    </script>
